name: Compilar FenixCRM APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK instalable
        run: gradle assembleDebug

      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk FenixCRM.apk

      - name: Subir FenixCRM.apk como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FenixCRM-APK
          path: FenixCRM.apk

      - name: Publicar descarga directa sin ZIP (Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: FenixCRM v1.1.0 (Alarma con anillo luminoso)
          body: Descarga directa de FenixCRM.apk para Android con alarma despertador animada.
          files: FenixCRM.apk
          make_latest: true
